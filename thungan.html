<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thu ngân Karaoke Rita</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/700.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/800.css" />
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5;
      --success: #10b981; --success-dark: #059669;
      --danger: #ef4444; --danger-dark: #dc2626;
      --warning: #f59e0b;
      --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
      --text-secondary: #64748b; --border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.06); --radius: 12px;
      --color-open: #0369a1;
      --color-paid: #065f46;
      
      /* Font sizes mặc định - LỚN */
      --fs-base: 16px;
      --fs-room: 16px;
      --fs-input: 16px;
      --fs-btn: 14px;
      --fs-badge: 13px;
      --fs-time-val: 15px;
      --fs-time-label: 10px;
      --fs-th: 12px;
      
      /* Padding mặc định */
      --pd-cell: 12px 10px;
      --pd-header: 20px 20px 16px;
      --pd-input: 10px 14px;
      --pd-btn: 8px 16px;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: var(--fs-base); }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: var(--fs-base);
    }

    .app-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
      color: white; text-align: center; padding: var(--pd-header);
      position: relative;
      flex-shrink: 0;
    }
    .app-header h1 { font-size: clamp(20px, 2.2vw, 26px); font-weight: 800; letter-spacing: -0.5px; }
    .app-header h1 span { display: inline; font-size: clamp(12px, 1.4vw, 15px); font-weight: 600; opacity: 0.9; margin-left: 8px; letter-spacing: 2px; text-transform: uppercase; }
    #currentTime { font-weight: 600; font-size: clamp(12px, 1.3vw, 14px); margin-top: 6px; background: rgba(255,255,255,0.15); display: inline-block; padding: 4px 14px; border-radius: 14px; }

    .speed-widget {
      position: absolute; top: 12px; right: 14px; z-index: 10;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border-radius: 8px; padding: 8px 12px; font-size: 11px;
      min-width: 145px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
      transition: background 0.2s;
    }
    .speed-widget:hover { background: rgba(255,255,255,0.25); }
    .speed-widget .sw-title { font-weight: 700; font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.9; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .speed-widget .sw-title .dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; display: inline-block; }
    .speed-widget .sw-title .dot.testing { background: #fbbf24; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .speed-widget .sw-row { display: flex; justify-content: space-between; align-items: center; padding: 1px 0; font-size: 10px; }
    .speed-widget .sw-label { opacity: 0.8; font-weight: 500; }
    .speed-widget .sw-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .sw-val-dl { color: #93c5fd; } .sw-val-ul { color: #c4b5fd; } .sw-val-pg { color: #fda4af; }
    .speed-widget .sw-status { font-size: 8px; opacity: 0.7; margin-top: 3px; text-align: center; }

    .container { 
      flex: 1; 
      max-width: 1200px; 
      width: 100%;
      margin: 0 auto; 
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .card { 
      background: var(--card); 
      border-radius: var(--radius); 
      box-shadow: var(--shadow); 
      overflow: hidden; 
      border: 1px solid var(--border);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .table-wrapper { 
      overflow-y: auto; 
      flex: 1;
      min-height: 0;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th { 
      background: linear-gradient(135deg, #f8fafc, #f1f5f9); 
      color: var(--text-secondary); 
      font-size: var(--fs-th); 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.6px; 
      padding: var(--pd-cell); 
      border-bottom: 2px solid var(--border); 
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    tbody tr { transition: all 0.2s ease; border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f8fafc; }
    tbody td { 
      padding: var(--pd-cell); 
      text-align: center; 
      vertical-align: middle; 
      font-size: var(--fs-base); 
    }
    
    .room-name { font-weight: 700; font-size: var(--fs-room); color: var(--text); }
    .room-name-unpaid { font-weight: 800; font-size: var(--fs-room); color: var(--danger); }
    
    .amount-input { 
      width: clamp(90px, 10vw, 130px); 
      padding: var(--pd-input); 
      border: 2px solid var(--border); 
      border-radius: 8px; 
      font-size: var(--fs-input); 
      font-weight: 600; 
      text-align: right; 
      background: #f8fafc; 
      transition: all 0.2s ease; 
    }
    .amount-input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .amount-input::placeholder { color: #cbd5e1; font-weight: 400; }

    .btn { 
      padding: var(--pd-btn); 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: var(--fs-btn); 
      font-weight: 600; 
      transition: all 0.15s ease; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-open { background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: white; box-shadow: 0 1px 4px rgba(14,165,233,0.25); }
    .btn-open:hover:not(:disabled) { background: linear-gradient(135deg, #0284c7, #0ea5e9); }
    .btn-update { background: linear-gradient(135deg, var(--success), #34d399); color: white; box-shadow: 0 1px 4px rgba(16,185,129,0.25); }
    .btn-update:hover:not(:disabled) { background: linear-gradient(135deg, var(--success-dark), var(--success)); }
    .btn-update.enabled { animation: pulse-green 1.5s ease-in-out infinite; }
    @keyframes pulse-green { 0%, 100% { box-shadow: 0 1px 4px rgba(16,185,129,0.25); } 50% { box-shadow: 0 1px 8px rgba(16,185,129,0.4); } }
    .btn-paid { background: linear-gradient(135deg, var(--danger), #f87171); color: white; box-shadow: 0 1px 4px rgba(239,68,68,0.25); }
    .btn-paid:hover:not(:disabled) { background: linear-gradient(135deg, var(--danger-dark), var(--danger)); }

    .status-badge { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 14px; 
      font-size: var(--fs-badge); 
      font-weight: 700; 
      white-space: nowrap;
    }
    .status-chua-mo { background: #f1f5f9; color: #64748b; }
    .status-dang-mo-red { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .status-da-thanh-toan { background: #d1fae5; color: var(--color-paid); }

    tr.bg-unpaid { background: #fef2f2; }
    tr.bg-unpaid:hover { background: #fee2e2; }

    .time-cell { 
      display: flex; 
      flex-direction: column; 
      gap: 4px;
      align-items: center;
    }
    .time-open, .time-paid { 
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1.2;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .time-open { 
      color: var(--color-open);
      background: rgba(3, 105, 161, 0.08);
    }
    .time-paid { 
      color: var(--color-paid);
      background: rgba(6, 95, 70, 0.08);
    }
    .time-label { 
      font-size: var(--fs-time-label); 
      text-transform: uppercase; 
      letter-spacing: 0.3px; 
      font-weight: 700;
    }
    .time-value { 
      font-size: var(--fs-time-val); 
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center; }
    .loading-overlay.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { 
      position: fixed; top: 50%; left: 50%; 
      transform: translate(-50%, -50%) scale(0.9); 
      background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(8px);
      color: white; padding: 18px 30px; border-radius: 14px; 
      font-size: 16px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
      opacity: 0; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      z-index: 3000; text-align: center; min-width: 300px; pointer-events: none;
    }
    .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    .toast.error { background: rgba(220, 38, 38, 0.95); }
    .toast.success { background: rgba(16, 185, 129, 0.95); }

    .check-inventory-btn { 
      display: block; 
      max-width: 300px; 
      margin: 10px auto 14px; 
      padding: 12px 24px; 
      background: linear-gradient(135deg, #f59e0b, #fbbf24); 
      color: #78350f; 
      border: none; 
      border-radius: 10px; 
      font-size: 15px; 
      font-weight: 800; 
      font-family: 'Inter', sans-serif; 
      cursor: pointer; 
      text-align: center; 
      text-decoration: none; 
      letter-spacing: 0.5px; 
      box-shadow: 0 2px 8px rgba(245,158,11,0.3); 
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .check-inventory-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245,158,11,0.4); }
    .check-inventory-btn:active { transform: translateY(0); }
    .check-inventory-btn .icon { margin-right: 6px; }

    /* ===== RESPONSIVE THEO CHIỀU CAO (max-height) ===== */
    /* Giảm dần font khi viewport thấp */
    
    @media (max-height: 900px) {
      :root {
        --fs-base: 15px;
        --fs-room: 15px;
        --fs-input: 15px;
        --fs-btn: 13px;
        --fs-badge: 12px;
        --fs-time-val: 14px;
        --fs-th: 11px;
        --pd-cell: 10px 8px;
        --pd-header: 16px 20px 14px;
        --pd-input: 8px 12px;
        --pd-btn: 7px 14px;
      }
    }

    @media (max-height: 800px) {
      :root {
        --fs-base: 14px;
        --fs-room: 14px;
        --fs-input: 14px;
        --fs-btn: 12px;
        --fs-badge: 11px;
        --fs-time-val: 13px;
        --fs-time-label: 9px;
        --fs-th: 10px;
        --pd-cell: 8px 8px;
        --pd-header: 14px 20px 12px;
        --pd-input: 7px 10px;
        --pd-btn: 6px 12px;
      }
      .app-header h1 { font-size: 22px; }
      .app-header h1 span { font-size: 13px; }
      .check-inventory-btn { margin: 8px auto 10px; padding: 10px 20px; font-size: 14px; }
    }

    @media (max-height: 700px) {
      :root {
        --fs-base: 13px;
        --fs-room: 13px;
        --fs-input: 13px;
        --fs-btn: 11px;
        --fs-badge: 10px;
        --fs-time-val: 12px;
        --fs-time-label: 9px;
        --fs-th: 9px;
        --pd-cell: 6px 6px;
        --pd-header: 12px 16px 10px;
        --pd-input: 6px 8px;
        --pd-btn: 5px 10px;
      }
      .app-header h1 { font-size: 20px; }
      .app-header h1 span { font-size: 12px; }
      .app-header { padding: 10px 16px 8px; }
      #currentTime { font-size: 11px; padding: 3px 10px; margin-top: 4px; }
      .container { padding: 6px 12px; }
      .check-inventory-btn { margin: 6px auto 8px; padding: 8px 16px; font-size: 13px; }
      .status-badge { padding: 3px 8px; }
      .time-open, .time-paid { padding: 3px 8px; gap: 4px; }
    }

    @media (max-height: 600px) {
      :root {
        --fs-base: 12px;
        --fs-room: 12px;
        --fs-input: 12px;
        --fs-btn: 10px;
        --fs-badge: 10px;
        --fs-time-val: 11px;
        --fs-time-label: 8px;
        --fs-th: 9px;
        --pd-cell: 5px 5px;
        --pd-header: 10px 12px 8px;
        --pd-input: 5px 8px;
        --pd-btn: 4px 8px;
      }
      .app-header h1 { font-size: 18px; }
      .app-header h1 span { font-size: 11px; }
      .speed-widget { display: none; } /* Ẩn speed widget khi màn hình quá thấp */
      .container { padding: 4px 8px; }
      .check-inventory-btn { margin: 4px auto 6px; padding: 6px 14px; font-size: 12px; }
    }

    /* Responsive theo chiều rộng */
    @media (max-width: 700px) {
      .speed-widget { position: static; margin: 6px auto 0; max-width: 180px; }
      .btn { padding: 5px 8px; font-size: 11px; }
      .amount-input { width: 90px; font-size: 13px; }
      .room-name, .room-name-unpaid { font-size: 13px; }
      .app-header h1 span { display: block; margin-left: 0; margin-top: 2px; }
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
  <div class="toast" id="toast"></div>

  <header class="app-header">
    <div class="speed-widget" id="speedWidget" title="Nhấn để kiểm tra tốc độ">
      <div class="sw-title"><span class="dot" id="swDot"></span> Tốc độ mạng</div>
      <div class="sw-row"><span class="sw-label">↓ Tải</span><span class="sw-value sw-val-dl" id="swDl">—</span></div>
      <div class="sw-row"><span class="sw-label">↑ Tải lên</span><span class="sw-value sw-val-ul" id="swUl">—</span></div>
      <div class="sw-row"><span class="sw-label">◎ Trễ</span><span class="sw-value sw-val-pg" id="swPg">—</span></div>
      <div class="sw-status" id="swStatus">Nhấn để kiểm tra</div>
    </div>
    <h1>THU NGÂN<span>Karaoke Rita</span></h1>
    <div id="currentTime"></div>
  </header>

  <div class="container">
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Phòng</th>
              <th>Số tiền</th>
              <th>Hành động</th>
              <th>Trạng thái</th>
              <th>Thời gian</th>
            </tr>
          </thead>
          <tbody id="roomTable">
            <tr><td colspan="5" style="padding: 30px; color: #64748b;">Đang kết nối...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <a href="https://karaokerita.github.io/qr/kho.html" class="check-inventory-btn" target="_blank">
      <span class="icon">📦</span> KIỂM KHO
    </a>
  </div>

  <script>
    const SUPABASE_URL = 'https://nmgofzqtebcnfhttaudy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tZ29menF0ZWJjbmZodHRhdWR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTQ3NzQsImV4cCI6MjEwMjE3MDc3NH0.R9sPaChT0I96n42zSVI5umCITV9G7y-H2cl18qK3RMY';
    const ROOMS = ['Phong 3', 'Phong 4', 'Phong 5', 'Phong 6', 'Phong 7', 'Phong 8', 'Phong 9'];
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ROOM_NAME_MAP = {
      'Phong 3': 'Phòng 3', 'Phong 4': 'Phòng 4', 'Phong 5': 'Phòng 5',
      'Phong 6': 'Phòng 6', 'Phong 7': 'Phòng 7', 'Phong 8': 'Phòng 8', 'Phong 9': 'Phòng 9'
    };
    function getDisplayName(dbName) { return ROOM_NAME_MAP[dbName] || dbName; }

    const formatNumber = n => n ? Number(n).toLocaleString("vi-VN") : "";
    const parseNumber = str => Number(str.replace(/\./g, "").replace(/,/g, "")) || 0;
    
    const getCurrentTime = () => {
      const now = new Date();
      return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    };
    
    function formatTime(timeStr) {
      if (!timeStr) return '';
      const parts = String(timeStr).split(':');
      if (parts.length >= 2) return parts[0] + ':' + parts[1];
      return timeStr;
    }
    
    function isEmptyTime(timeStr) {
      if (!timeStr) return true;
      const formatted = formatTime(timeStr);
      return formatted === '00:00' || formatted === '';
    }
    
    function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('active', show); }
    
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message; 
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    const statusMap = {
      'chua mo': { text: 'Chưa mở', class: 'status-chua-mo' },
      'dang mo': { text: 'Đang mở', class: 'status-dang-mo-red' },
      'da thanh toan': { text: 'Đã thanh toán', class: 'status-da-thanh-toan' }
    };

    let previousRoomsData = [];

    async function initData() {
      console.log("🚀 Khởi tạo web thu ngân...");
      await loadRooms(true);
      
      supabaseClient
        .channel('thungan-realtime-cashier')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'thungan' }, async (payload) => {
          const activeEl = document.activeElement;
          const isTyping = activeEl && activeEl.classList.contains('amount-input');
          const savedVal = isTyping ? activeEl.value : null;
          const savedId = isTyping ? activeEl.id : null;
          await loadRooms(false);
          if (isTyping && savedId) {
            const el = document.getElementById(savedId);
            if (el) {
              el.value = savedVal;
              el.dispatchEvent(new Event('input'));
            }
          }
        })
        .subscribe();
    }

    async function loadRooms(displayLoading = true) {
      if (displayLoading) showLoading(true);
      try {
        const { data, error } = await supabaseClient.from('thungan').select('*').order('ten_phong', { ascending: true });
        if (error) throw new Error(error.message);
        if (!data || data.length === 0) {
           document.getElementById("roomTable").innerHTML = `<tr><td colspan="5" style="padding:30px; text-align:center;">Chưa có dữ liệu.</td></tr>`;
           return;
        }
        await checkAndResetDaily(data);
        await check30MinAfterPaid(data);
        if (hasDataChanged(previousRoomsData, data)) {
          renderTable(data);
          previousRoomsData = JSON.parse(JSON.stringify(data));
        }
      } catch (err) {
        console.error("Lỗi:", err);
        showToast("Lỗi CSDL: " + err.message, "error");
      } finally {
        if (displayLoading) showLoading(false);
      }
    }

    function hasDataChanged(oldData, newData) {
      if (!oldData || oldData.length !== newData.length) return true;
      for (let i = 0; i < newData.length; i++) {
        if (oldData[i].so_tien !== newData[i].so_tien ||
            oldData[i].trang_thai !== newData[i].trang_thai ||
            oldData[i].thoi_gian !== newData[i].thoi_gian ||
            oldData[i].thoi_gian_thanh_toan !== newData[i].thoi_gian_thanh_toan) {
          return true;
        }
      }
      return false;
    }

    async function checkAndResetDaily(currentData) {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];
      if (now.getHours() >= 5 && currentData.length > 0) {
        const needsReset = currentData.some(room => (room.ngay_cap_nhat || '').split('T')[0] < todayStr);
        if (needsReset) {
          for (const room of ROOMS) {
            await supabaseClient.from('thungan').update({
              trang_thai: 'chua mo', so_tien: 0, thoi_gian: '', thoi_gian_thanh_toan: '', ngay_cap_nhat: todayStr
            }).eq('ten_phong', room);
          }
          showToast("Đã reset dữ liệu ngày mới", "success");
        }
      }
    }

    async function check30MinAfterPaid(data) {
      const now = new Date();
      let needsUpdate = false;
      for (const room of data) {
        if (room.trang_thai === 'da thanh toan' && room.thoi_gian_thanh_toan) {
          const timeParts = room.thoi_gian_thanh_toan.split(':').map(Number);
          const paidTime = new Date();
          paidTime.setHours(timeParts[0], timeParts[1], timeParts[2] || 0, 0);
          let diffMs = now - paidTime;
          if (diffMs < 0) diffMs += 24 * 60 * 60 * 1000; 
          if ((diffMs / 1000 / 60) >= 30) {
            await supabaseClient.from('thungan').update({
              trang_thai: 'chua mo', so_tien: 0, thoi_gian: '', thoi_gian_thanh_toan: ''
            }).eq('ten_phong', room.ten_phong);
            needsUpdate = true;
          }
        }
      }
      if (needsUpdate) showToast("Đã đóng các phòng quá 30 phút sau thanh toán", "success");
    }

    function renderTable(data) {
      const table = document.getElementById("roomTable");
      if (table.children.length !== data.length) {
        table.innerHTML = "";
        data.forEach(room => {
          const tr = document.createElement("tr");
          tr.dataset.roomId = room.ten_phong;
          tr.innerHTML = `
            <td class="cell-name"></td>
            <td class="cell-amount"><input type="text" class="amount-input" autocomplete="off" oninput="onAmountChange('${room.ten_phong}')" onkeypress="if(event.key==='Enter'){updateAmount('${room.ten_phong}')}"></td>
            <td class="cell-actions"></td>
            <td class="cell-status"></td>
            <td class="cell-time"></td>
          `;
          table.appendChild(tr);
        });
      }
      
      const rows = table.children;
      data.forEach((room, index) => {
        const tr = rows[index];
        if (!tr) return;
        
        const displayName = getDisplayName(room.ten_phong);
        const isDangMo = room.trang_thai === 'dang mo';
        
        const displayAmount = (room.so_tien && room.so_tien > 0) ? formatNumber(room.so_tien) : "";
        
        let timeHTML = '';
        if (!isEmptyTime(room.thoi_gian)) {
          timeHTML += `<div class="time-open"><span class="time-label">Mở</span><span class="time-value">${formatTime(room.thoi_gian)}</span></div>`;
        }
        if (!isEmptyTime(room.thoi_gian_thanh_toan)) {
          timeHTML += `<div class="time-paid"><span class="time-label">Thanh toán</span><span class="time-value">${formatTime(room.thoi_gian_thanh_toan)}</span></div>`;
        }
        if (!timeHTML) timeHTML = '<span style="color:#94a3b8;font-size:12px;">—</span>';

        tr.className = isDangMo ? 'bg-unpaid' : '';
        tr.querySelector('.cell-name').innerHTML = `<span class="${isDangMo ? 'room-name-unpaid' : 'room-name'}">${displayName}</span>`;
        
        const inputEl = tr.querySelector('.cell-amount input');
        inputEl.id = `amount-${room.ten_phong}`;
        if (document.activeElement !== inputEl) inputEl.value = displayAmount;

        tr.querySelector('.cell-actions').innerHTML = `
          <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap;">
            <button id="btn-open-${room.ten_phong}" class="btn btn-open" ${isDangMo ? 'disabled' : ''} onclick="openRoom('${room.ten_phong}')">🔓 Mở</button>
            <button id="btn-update-${room.ten_phong}" class="btn btn-update" disabled onclick="updateAmount('${room.ten_phong}')">💾</button>
            <button id="btn-paid-${room.ten_phong}" class="btn btn-paid" ${!isDangMo ? 'disabled' : ''} onclick="markPaid('${room.ten_phong}')">✅ TT</button>
          </div>
        `;
        
        tr.querySelector('.cell-status').innerHTML = `<span class="status-badge ${statusMap[room.trang_thai].class}">${statusMap[room.trang_thai].text}</span>`;
        tr.querySelector('.cell-time').innerHTML = `<div class="time-cell">${timeHTML}</div>`;
      });
    }

    async function openRoom(roomName) {
      const btn = document.getElementById(`btn-open-${roomName}`);
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳...'; }

      const openTime = getCurrentTime();

      const { error } = await supabaseClient.from('thungan').update({
        trang_thai: 'dang mo', so_tien: 0, 
        thoi_gian: openTime, thoi_gian_thanh_toan: ''
      }).eq('ten_phong', roomName);

      if (!error) showToast(`✅ Mở ${getDisplayName(roomName)} lúc ${openTime}`); 
      else showToast("❌ " + error.message, "error");

      if (btn) { btn.disabled = false; btn.innerHTML = '🔓 Mở'; }
      await loadRooms(false);
    }

    function onAmountChange(roomName) {
      const input = document.getElementById(`amount-${roomName}`);
      const raw = input.value.replace(/\./g, "").replace(/,/g, "");
      input.value = raw ? Number(raw).toLocaleString("vi-VN") : "";
      const btn = document.getElementById(`btn-update-${roomName}`);
      if (btn) { btn.disabled = false; btn.classList.add('enabled'); }
    }

    async function updateAmount(roomName) {
      const amount = parseNumber(document.getElementById(`amount-${roomName}`).value);
      const btn = document.getElementById(`btn-update-${roomName}`);
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳'; }
      
      const currentRoom = previousRoomsData.find(r => r.ten_phong === roomName);
      let updatePayload = { so_tien: amount };
      let actionMessage = `✅ Cập nhật ${getDisplayName(roomName)}`;
      
      if (currentRoom && (currentRoom.trang_thai === 'chua mo' || currentRoom.trang_thai === 'da thanh toan')) {
        const openTime = getCurrentTime();
        updatePayload.trang_thai = 'dang mo';
        updatePayload.thoi_gian = openTime;
        updatePayload.thoi_gian_thanh_toan = '';
        actionMessage = `✅ Mở ${getDisplayName(roomName)} lúc ${openTime}`;
      }

      const { error } = await supabaseClient.from('thungan').update(updatePayload).eq('ten_phong', roomName);
      
      if (!error) showToast(actionMessage, "success"); 
      else showToast("❌ " + error.message, "error");

      if (btn) { btn.disabled = false; btn.innerHTML = '💾'; btn.classList.remove('enabled'); }
      await loadRooms(false);
    }

    async function markPaid(roomName) {
      const btn = document.getElementById(`btn-paid-${roomName}`);
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳'; }

      const paidTime = getCurrentTime();

      const { error } = await supabaseClient.from('thungan').update({
        trang_thai: 'da thanh toan', 
        thoi_gian_thanh_toan: paidTime
      }).eq('ten_phong', roomName);

      if (!error) showToast(`✅ TT ${getDisplayName(roomName)} lúc ${paidTime}`); 
      else showToast("❌ " + error.message, "error");

      if (btn) { btn.disabled = false; btn.innerHTML = '✅ TT'; }
      await loadRooms(false);
    }

    function updateClock() {
      const now = new Date();
      const days = ["CN","T2","T3","T4","T5","T6","T7"];
      document.getElementById("currentTime").innerText = 
        `${now.toLocaleTimeString("vi-VN", {hour12: false})} • ${days[now.getDay()]}, ${now.toLocaleDateString("vi-VN")}`;
    }
    setInterval(updateClock, 1000); updateClock();

    initData();
    setInterval(() => loadRooms(false), 10000);

    const swDot = document.getElementById('swDot'), swDl = document.getElementById('swDl');
    const swUl = document.getElementById('swUl'), swPg = document.getElementById('swPg');
    const swStatus = document.getElementById('swStatus'), speedWidget = document.getElementById('speedWidget');
    let speedTestRunning = false;
    function swSetStatus(text, testing = false) { swStatus.textContent = text; swDot.className = testing ? 'dot testing' : 'dot'; }
    
    async function measurePing(iterations = 6) {
      const pings = [];
      for (let i = 0; i < iterations; i++) {
        const start = performance.now();
        try { await fetch('https://www.youtube.com/favicon.ico?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store' }); } catch(e) {}
        pings.push(performance.now() - start);
      }
      pings.sort((a, b) => a - b);
      return pings.slice(1, -1).reduce((s, v) => s + v, 0) / (pings.length - 2);
    }

    async function measureDownload(durationMs = 5000) {
      const startTime = performance.now(); let totalBytes = 0;
      const controller = new AbortController();
      setTimeout(() => controller.abort(), durationMs + 2000);
      await Promise.allSettled(Array.from({ length: 2 }, async () => {
        while (performance.now() - startTime < durationMs) {
          try {
            const resp = await fetch('https://speed.cloudflare.com/__down?bytes=10000000&_=' + Date.now(), { signal: controller.signal, cache: 'no-store' });
            const reader = resp.body.getReader();
            while (performance.now() - startTime < durationMs) {
              const { done, value } = await reader.read(); if (done) break; totalBytes += value.length;
            }
          } catch(e) { if (e.name !== 'AbortError') break; }
        }
      }));
      return ((performance.now() - startTime) / 1000) > 0 ? (totalBytes * 8) / (((performance.now() - startTime) / 1000) * 1000000) : 0;
    }

    async function measureUpload(durationMs = 4000) {
      const startTime = performance.now(); let totalBytes = 0;
      const data = new Blob([new ArrayBuffer(1000000)]);
      const controller = new AbortController();
      setTimeout(() => controller.abort(), durationMs + 2000);
      await Promise.allSettled(Array.from({ length: 2 }, async () => {
        while (performance.now() - startTime < durationMs) {
          try { await fetch('https://speed.cloudflare.com/__up', { method: 'POST', body: data, signal: controller.signal, cache: 'no-store' }); totalBytes += 1000000; } 
          catch(e) { if (e.name !== 'AbortError') break; }
        }
      }));
      return ((performance.now() - startTime) / 1000) > 0 ? (totalBytes * 8) / (((performance.now() - startTime) / 1000) * 1000000) : 0;
    }

    async function runSpeedTest() {
      if (speedTestRunning) return; speedTestRunning = true; swSetStatus('Đang đo...', true);
      try {
        swPg.textContent = Math.round(await measurePing(6)) + 'ms'; swSetStatus('Đo tải...', true);
        const dl = await measureDownload(5000); swDl.textContent = dl > 0 ? dl.toFixed(1) + ' Mbps' : '—';
        swSetStatus('Đo tải lên...', true);
        const ul = await measureUpload(4000); swUl.textContent = ul > 0 ? ul.toFixed(1) + ' Mbps' : '—';
        swSetStatus('Cập nhật ' + getCurrentTime());
      } catch(e) { swSetStatus('Lỗi'); }
      speedTestRunning = false;
    }
    speedWidget.addEventListener('click', runSpeedTest);
    setInterval(runSpeedTest, 10 * 60 * 1000); runSpeedTest();
  </script>
</body>
</html>
